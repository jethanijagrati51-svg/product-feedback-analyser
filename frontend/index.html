<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Feedback Analyser</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Product Feedback Analyser</h1>
            <p>Turning Zomato reviews into product insights</p>
        </header>


        <section class="stats">

            <div class="card">
                <h2 id="reviewCount">0</h2>
                <p>Reviews Analysed</p>
            </div>

            <div class="card">
                <h2 id="themeCount">0</h2>
                <p>Themes</p>
            </div>

            <div class="card">
                <h2 id="featureCount">0</h2>
                <p>Features</p>
            </div>

        </section>


        <section class="section">

            <h2>Top Customer Pain Points</h2>

            <div id="painPoints">
                Loading...
            </div>

        </section>


        <section class="section">

            <h2>Feature Priorities</h2>

            <div id="priorities">
                Loading...
            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>

</html>
